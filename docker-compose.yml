version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: portfolio-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - ENVIRONMENT=production
      - DATABASE_URL=/data/portfolio.db
      - FRONTEND_URL=http://localhost:5173
      - COOKIE_SECURE=false
      - ADMIN_SESSION_SECRET=replace-with-a-real-secret-32-characters-min
      - CSRF_SECRET=replace-with-a-real-csrf-secret-32-characters-min
    volumes:
      - portfolio-data:/data
      - portfolio-backups:/backups

volumes:
  portfolio-data:
  portfolio-backups:
