<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1100" width="100%" height="100%">
  <defs>
    <linearGradient id="aboutGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141414"/>
      <stop offset="50%" stop-color="#1a1a1a"/>
      <stop offset="100%" stop-color="#0d0d0d"/>
    </linearGradient>
    <linearGradient id="codeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#333333"/>
      <stop offset="100%" stop-color="#1f1f1f"/>
    </linearGradient>
  </defs>

  <!-- Background Base -->
  <rect width="900" height="1100" fill="url(#aboutGrad)"/>

  <!-- Technical Architectural Lines -->
  <line x1="70" y1="60" x2="830" y2="60" stroke="#2c2c2c" stroke-width="1"/>
  <line x1="70" y1="1040" x2="830" y2="1040" stroke="#2c2c2c" stroke-width="1"/>
  <line x1="70" y1="60" x2="70" y2="1040" stroke="#2c2c2c" stroke-width="1"/>
  <line x1="830" y1="60" x2="830" y2="1040" stroke="#2c2c2c" stroke-width="1"/>

  <!-- Editorial Geometric Composition -->
  <rect x="130" y="140" width="640" height="740" fill="#181818" stroke="#2e2e2e" stroke-width="1"/>
  <rect x="160" y="170" width="580" height="420" fill="url(#codeGrad)"/>

  <!-- Code Architecture Abstract Blocks -->
  <g transform="translate(200, 220)">
    <rect x="0" y="0" width="160" height="12" rx="2" fill="#555555"/>
    <rect x="0" y="24" width="280" height="8" rx="2" fill="#3a3a3a"/>
    <rect x="0" y="44" width="220" height="8" rx="2" fill="#3a3a3a"/>
    <rect x="20" y="64" width="300" height="8" rx="2" fill="#444444"/>
    <rect x="40" y="84" width="260" height="8" rx="2" fill="#3a3a3a"/>
    <rect x="40" y="104" width="180" height="8" rx="2" fill="#505050"/>
    <rect x="20" y="124" width="140" height="8" rx="2" fill="#3a3a3a"/>

    <rect x="0" y="160" width="190" height="12" rx="2" fill="#666666"/>
    <rect x="20" y="184" width="340" height="8" rx="2" fill="#444444"/>
    <rect x="40" y="204" width="240" height="8" rx="2" fill="#3a3a3a"/>
    <rect x="40" y="224" width="290" height="8" rx="2" fill="#4a4a4a"/>
    <rect x="20" y="244" width="80" height="8" rx="2" fill="#3a3a3a"/>
  </g>

  <!-- Editorial Typographic Stamp -->
  <g transform="translate(160, 630)">
    <text x="0" y="40" fill="#EEEEEE" font-family="'Inter', sans-serif" font-size="28" font-weight="800" letter-spacing="-0.02em">VALENTINE OMONDI AWILI</text>
    <text x="0" y="70" fill="#888888" font-family="'Inter', sans-serif" font-size="14" font-weight="600" letter-spacing="0.18em">FULL-STACK ENGINEER</text>
    <text x="0" y="105" fill="#666666" font-family="'Inter', sans-serif" font-size="13" line-height="1.6">REACT • VITE • GO • SQLITE • REST ARCHITECTURE</text>
  </g>

  <!-- Numbering & Meta Markers -->
  <text x="130" y="1005" fill="#555555" font-family="'Inter', sans-serif" font-size="13" letter-spacing="0.2em">EDITORIAL BIOGRAPHY // CHAPTER 02</text>
  <text x="770" y="1005" fill="#777777" font-family="'Inter', sans-serif" font-size="20" font-weight="300" text-anchor="end">02</text>
</svg>
