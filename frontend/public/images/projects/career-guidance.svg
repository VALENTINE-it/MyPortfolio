      <stop offset="0%" stop-color="#141414"/>
      <stop offset="50%" stop-color="#1c1c1c"/>
      <stop offset="100%" stop-color="#0a0a0a"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="800" fill="url(#proj2Grad)"/>

  <!-- Compass / Pathway Flow Graphic -->
